[project]
name = "langgraph-banking-agent-tutorial"
version = "0.1.0"
description = "A beginner-friendly tutorial for building AI agents with LangGraph, using a small banking assistant as the example."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
llm = ["langchain>=1.0", "langchain-anthropic", "langchain-openai"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
